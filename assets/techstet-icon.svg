<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="techstet: the stet mark, a struck line kept">
  <title>techstet</title>
  <rect width="512" height="512" rx="104" fill="#0B1220"/>
  <!-- three lines of text -->
  <rect x="96" y="150" width="320" height="26" rx="13" fill="#CBD5E1"/>
  <rect x="96" y="243" width="320" height="26" rx="13" fill="#F8FAFC"/>
  <rect x="96" y="336" width="224" height="26" rx="13" fill="#CBD5E1"/>
  <!-- the editor's strike through the middle line -->
  <line x1="78" y1="256" x2="434" y2="256" stroke="#EF4444" stroke-width="12" stroke-linecap="round"/>
  <!-- stet: the dots that say "let it stand" -->
  <g fill="#EF4444">
    <circle cx="124" cy="300" r="10"/>
    <circle cx="177" cy="300" r="10"/>
    <circle cx="230" cy="300" r="10"/>
    <circle cx="283" cy="300" r="10"/>
    <circle cx="336" cy="300" r="10"/>
    <circle cx="389" cy="300" r="10"/>
  </g>
</svg>
